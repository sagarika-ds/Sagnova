<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Sags News — Your World, Curated</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --text: #f4f2ee;
      --muted: rgba(244, 242, 238, 0.65);
      --glass: rgba(20, 18, 25, 0.45);
      --glass-border: rgba(255, 255, 255, 0.14);
      --accent: #d9b968;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      color: var(--text);
      overflow-x: hidden;
    }

    .serif {
      font-family: 'Playfair Display', serif;
    }

    /* ---------------- HERO / LANDING VIEW ---------------- */
    #heroView {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background:
        linear-gradient(180deg, rgba(5, 8, 20, 0.25) 0%, rgba(5, 8, 20, 0.55) 60%, rgba(5, 8, 20, 0.8) 100%),
        url('Sg.jpg') center/cover no-repeat,
        linear-gradient(160deg, #060912 0%, #0b1330 35%, #1a2550 65%, #060912 100%);
      background-blend-mode: normal;
      padding: 40px 5vw;
    }

    #heroView>* {
      position: relative;
      z-index: 1;
    }

    .top-row {
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      gap: 24px;
      flex-wrap: wrap;
      position: relative;
      min-height: 30vh;
    }

    /* Left: greeting / clock */
    .greet-block {
      max-width: 560px;
      position: absolute;
      top: calc(8vh - 1cm);
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
    }

    .greet-title {
      font-size: clamp(30px, 5vw, 52px);
      font-weight: 700;
      line-height: 1.08;
      margin-bottom: 14px;
      background: linear-gradient(180deg, #e2bdbd 0%, #dbac3f 60%, #e3c371 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
      letter-spacing: -0.01em;
    }

    .clock-row {
      justify-content: center;
    }

    .greet-eyebrow {
      font-size: 13px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .greet-title {
      font-size: clamp(30px, 5vw, 52px);
      font-weight: 700;
      line-height: 1.08;
      margin-bottom: 14px;
    }

    .greet-sub {
      color: var(--muted);
      font-size: 15px;
      margin-bottom: 22px;
    }

    .clock-row {
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
    }

    .clock-item {}

    .clock-num {
      font-size: 26px;
      font-weight: 700;
      font-family: 'Playfair Display', serif;
    }

    .clock-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    /* Right: glass topic panel */
    .topic-panel {
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      border: none;
      border-radius: 0;
      padding: 0;
      width: min(280px, 100%);
      margin-right: 0;
      box-shadow: none;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .topic-panel h3 {
      font-family: 'Playfair Display', serif;
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(255, 255, 255, 0.75);
      letter-spacing: 0.04em;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
    }

    .topic-grid {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
      max-height: none;
      overflow: visible;
      padding: 0;
    }

    @keyframes floaty {

      0%,
      100% {
        transform: translateX(0);
      }

      50% {
        transform: translateX(-5px);
      }
    }

    .topic-btn {
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      border: none;
      color: rgba(255, 255, 255, 0.9);
      padding: 3px 2px;
      border-radius: 0;
      font-size: 16px;
      font-weight: 600;
      font-family: 'Playfair Display', serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: flex-end;
      text-align: right;
      transition: all 0.2s ease;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.75), 0 0 26px rgba(0, 0, 0, 0.45);
      animation: floaty 5s ease-in-out infinite;
    }

    .topic-btn:nth-child(2n) {
      animation-delay: -1.6s;
    }

    .topic-btn:nth-child(3n) {
      animation-delay: -3.1s;
    }

    .topic-btn span:first-child {
      font-size: 15px;
    }

    .topic-btn:hover {
      color: var(--accent);
      transform: translateX(-8px) scale(1.06);
      text-shadow: 0 2px 18px rgba(217, 185, 104, 0.8);
      animation-play-state: paused;
    }

    .all-btn {
      margin-top: 16px;
      background: rgba(217, 185, 104, 0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: var(--accent);
      font-weight: 700;
      border: 1px solid rgba(217, 185, 104, 0.5);
      padding: 12px 22px;
      border-radius: 999px;
      font-size: 13px;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .all-btn:hover {
      transform: translateY(-2px);
      background: rgba(217, 185, 104, 0.22);
    }

    /* Bottom hero tagline */
    .bottom-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .brand span {
      color: var(--accent);
    }

    .scroll-hint {
      display: none;
    }

    @keyframes sparklePulse {

      0%,
      100% {
        box-shadow: 0 0 20px 4px rgba(217, 185, 104, 0.35), inset 0 0 12px rgba(255, 255, 255, 0.15);
      }

      50% {
        box-shadow: 0 0 34px 10px rgba(217, 185, 104, 0.55), inset 0 0 18px rgba(255, 255, 255, 0.3);
      }
    }

    @keyframes sparkleSpin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .sparkle-bubble {
      display: flex;
      align-items: center;
      gap: 10px;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.25), rgba(217, 185, 104, 0.12) 60%, rgba(20, 18, 25, 0.4));
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 999px;
      padding: 10px 20px 10px 14px;
      cursor: default;
      animation: sparklePulse 2.6s ease-in-out infinite;
    }

    .sparkle-bubble .sparkle-icon {
      display: inline-block;
      animation: sparkleSpin 6s linear infinite;
      font-size: 18px;
    }

    .sparkle-bubble .sparkle-text {
      font-size: 12.5px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.9);
      font-weight: 500;
    }

    /* ---------------- CATEGORY VIEW ---------------- */
    #categoryView {
      display: none;
      min-height: 100vh;
      padding: 32px 5vw 100px;
      position: relative;
    }

    #categoryView.active {
      display: block;
    }

    #heroView.hidden {
      display: none;
    }

    .cat-bg-layer {
      position: fixed;
      inset: -20px;
      z-index: -1;
      background:
        linear-gradient(180deg, rgba(5, 8, 20, 0.55) 0%, rgba(5, 8, 20, 0.75) 100%),
        url('https://lh3.googleusercontent.com/d/1GG8QABY0V7b2jzg6UjJI6cXsVY1ipoFy') center/cover no-repeat;
      filter: blur(22px) brightness(0.6) saturate(1.1);
      transform: scale(1.08);
      /* avoids blurred edges peeking in */
    }

    /* ---------------- GAME-STYLE TOPIC BURST TRANSITION ---------------- */
    .burst-overlay {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(6, 9, 18, 0);
      pointer-events: none;
      transition: background 0.35s ease;
    }

    .burst-overlay.burst-grow {
      background: rgba(6, 9, 18, 0.7);
    }

    .burst-text {
      font-size: clamp(22px, 4.2vw, 46px);
      font-weight: 700;
      color: #fff;
      text-shadow: 0 0 40px rgba(217, 185, 104, 0.6);
      transform: scale(0.3);
      opacity: 0;
      transition: transform 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.2), opacity 0.4s ease;
      text-align: center;
      line-height: 1.4;
      padding: 0 5vw;
    }

    .burst-line-2 {
      font-size: 0.55em;
      font-weight: 500;
      color: var(--accent);
      margin-top: 6px;
    }

    .burst-overlay.burst-grow .burst-text {
      transform: scale(1);
      opacity: 1;
    }

    .burst-overlay.burst-explode .burst-text {
      transform: scale(2.6);
      opacity: 0;
      transition: transform 0.55s cubic-bezier(0.4, 0, 1, 1), opacity 0.5s ease;
    }

    .burst-overlay.burst-explode {
      background: rgba(6, 9, 18, 0);
      transition: background 0.5s ease 0.1s;
    }

    .cat-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .cat-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(26px, 4vw, 40px);
      font-weight: 700;
    }

    .cat-title .emoji {
      margin-right: 10px;
    }

    .status {
      color: var(--muted);
      text-align: center;
      padding: 60px 0;
      font-size: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 18px;
    }

    .card {
      background: rgba(15, 14, 20, 0.4);
      backdrop-filter: blur(20px) saturate(150%);
      -webkit-backdrop-filter: blur(20px) saturate(150%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 20px;
      padding: 22px;
      transform-style: preserve-3d;
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s ease, border-color 0.25s ease;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 20px 40px -20px rgba(0, 0, 0, 0.5);
    }

    .card:hover {
      transform: translateY(-6px) rotateX(2deg) rotateY(-2deg);
      box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.6);
      border-color: var(--accent);
    }

    .src {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .headline {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .summary {
      color: rgba(244, 242, 238, 0.85);
      font-size: 14px;
      line-height: 1.55;
      margin-bottom: 10px;
    }

    .why {
      color: var(--muted);
      font-size: 12.5px;
      font-style: italic;
      margin-bottom: 14px;
    }

    .scores {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .score {
      font-size: 10.5px;
      background: rgba(255, 255, 255, 0.08);
      padding: 4px 8px;
      border-radius: 6px;
      color: var(--muted);
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .read-link {
      font-size: 12.5px;
      color: #12100a;
      background: var(--accent);
      padding: 7px 12px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
    }

    .google-link {
      font-size: 12.5px;
      color: var(--muted);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 7px 12px;
      border-radius: 8px;
      text-decoration: none;
    }

    .name-input-row {
      position: fixed;
      bottom: 16px;
      left: 16px;
      z-index: 5;
    }

    .name-input-row input {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      backdrop-filter: blur(8px);
    }

    /* Custom sparkle cursor */
    body {
      cursor: none;
    }

    #sparkleCursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 26px;
      height: 26px;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      filter: drop-shadow(0 0 6px rgba(217, 185, 104, 0.9)) drop-shadow(0 0 14px rgba(217, 185, 104, 0.5));
      animation: sparkleSpin 5s linear infinite;
      transition: transform 0.06s linear;
    }

    #sparkleCursor.clicking {
      transform: translate(-50%, -50%) scale(0.7);
    }

    a,
    button,
    .topic-btn {
      cursor: none;
    }
  </style>
</head>

<style>
  /* ---------- 1. Animated aurora mesh overlay on hero ---------- */
  #heroView {
    position: relative;
    overflow: hidden;
  }

  .aurora-layer {
    position: absolute;
    inset: -20%;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 20% 20%, rgba(217, 185, 104, 0.25), transparent 35%),
      radial-gradient(circle at 80% 30%, rgba(124, 158, 255, 0.2), transparent 35%),
      radial-gradient(circle at 50% 80%, rgba(255, 124, 158, 0.18), transparent 35%);
    filter: blur(60px);
    animation: auroraDrift 18s ease-in-out infinite alternate;
    mix-blend-mode: screen;
  }

  @keyframes auroraDrift {
    0% {
      transform: translate(0, 0) scale(1) rotate(0deg);
    }

    50% {
      transform: translate(-3%, 2%) scale(1.15) rotate(8deg);
    }

    100% {
      transform: translate(2%, -3%) scale(1.05) rotate(-6deg);
    }
  }

  /* ---------- 2. Particle canvas (floating embers/sparkles) ---------- */
  #particleCanvas {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }

  /* ---------- 3. Magnetic glowing cursor orb (desktop only) ---------- */
  #magicCursor {
    position: fixed;
    top: 0;
    left: 0;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(217, 185, 104, 0.9), rgba(217, 185, 104, 0) 70%);
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: width 0.25s ease, height 0.25s ease, opacity 0.25s ease;
    mix-blend-mode: screen;
  }

  #magicCursor.hovering {
    width: 60px;
    height: 60px;
  }

  @media (hover: none) {
    #magicCursor {
      display: none;
    }
  }

  /* ---------- 4. Glitch/scramble entrance for the greeting ---------- */
  .greet-title.glitch-in {
    animation: glitchReveal 1.1s steps(2, end) both;
  }

  @keyframes glitchReveal {
    0% {
      opacity: 0;
      transform: translateX(-6px);
      filter: blur(6px) hue-rotate(0deg);
    }

    15% {
      opacity: 1;
      transform: translateX(4px);
      filter: blur(2px) hue-rotate(40deg);
    }

    30% {
      transform: translateX(-3px);
      filter: blur(3px) hue-rotate(-30deg);
    }

    45% {
      transform: translateX(2px);
      filter: blur(1px) hue-rotate(20deg);
    }

    60% {
      transform: translateX(-1px);
      filter: blur(0.5px) hue-rotate(-10deg);
    }

    100% {
      opacity: 1;
      transform: translateX(0);
      filter: blur(0) hue-rotate(0deg);
    }
  }

  /* ---------- 5. Shifting rainbow-gold text shimmer on hover ---------- */
  .greet-title:hover {
    background-size: 200% auto;
    animation: shimmerText 3s linear infinite;
  }

  @keyframes shimmerText {
    to {
      background-position: 200% center;
    }
  }

  /* ---------- 6. Card entrance: staggered 3D flip-in ---------- */
  .grid .card {
    opacity: 0;
    animation: cardFlyIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes cardFlyIn {
    from {
      opacity: 0;
      transform: translateY(40px) rotateX(-15deg) scale(0.92);
    }

    to {
      opacity: 1;
      transform: translateY(0) rotateX(0) scale(1);
    }
  }

  /* ---------- 7. Pulsing glow ring around topic panel ---------- */
  @keyframes ringPulse {

    0%,
    100% {
      box-shadow: 0 0 0 0 rgba(217, 185, 104, 0.0);
    }

    50% {
      box-shadow: 0 0 40px 6px rgba(217, 185, 104, 0.15);
    }
  }

  .topic-panel {
    animation: ringPulse 5s ease-in-out infinite;
    border-radius: 24px;
  }

  /* ---------- 8. Screen-flash + shockwave ring on burst click ---------- */
  .shockwave {
    position: fixed;
    z-index: 998;
    pointer-events: none;
    border: 2px solid rgba(217, 185, 104, 0.8);
    border-radius: 50%;
    top: 50%;
    left: 50%;
    width: 10px;
    height: 10px;
    transform: translate(-50%, -50%);
    animation: shockwaveExpand 0.9s ease-out forwards;
  }

  @keyframes shockwaveExpand {
    to {
      width: 2000px;
      height: 2000px;
      opacity: 0;
      border-width: 0.5px;
    }
  }
</style>

<canvas id="particleCanvas"></canvas>
<div id="magicCursor"></div>

<script>
  (function () {
    /* ---------- Inject aurora layer into hero if not already present ---------- */
    const hero = document.getElementById("heroView");
    if (hero && !hero.querySelector(".aurora-layer")) {
      const aurora = document.createElement("div");
      aurora.className = "aurora-layer";
      hero.insertBefore(aurora, hero.firstChild);
    }

    /* ---------- Glitch-in the greeting once on load ---------- */
    const greetEl = document.getElementById("greeting");
    if (greetEl) greetEl.classList.add("glitch-in");

    /* ---------- Particle system: soft floating embers ---------- */
    const canvas = document.getElementById("particleCanvas");
    const ctx = canvas.getContext("2d");
    let particles = [];
    const PARTICLE_COUNT = window.innerWidth < 700 ? 30 : 70;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    function spawnParticle() {
      return {
        x: Math.random() * canvas.width,
        y: canvas.height + 20,
        r: Math.random() * 2.2 + 0.6,
        speed: Math.random() * 0.6 + 0.15,
        drift: (Math.random() - 0.5) * 0.4,
        hue: Math.random() > 0.5 ? "217,185,104" : "124,158,255",
        alpha: Math.random() * 0.5 + 0.2,
        twinkle: Math.random() * 0.02 + 0.005,
      };
    }
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const p = spawnParticle();
      p.y = Math.random() * canvas.height; // spread initial positions
      particles.push(p);
    }

    function tick() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p) => {
        p.y -= p.speed;
        p.x += p.drift;
        p.alpha += (Math.random() - 0.5) * p.twinkle;
        p.alpha = Math.max(0.1, Math.min(0.8, p.alpha));

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${p.hue},${p.alpha})`;
        ctx.shadowBlur = 8;
        ctx.shadowColor = `rgba(${p.hue},0.8)`;
        ctx.fill();

        if (p.y < -20) Object.assign(p, spawnParticle());
      });
      requestAnimationFrame(tick);
    }
    tick();

    /* ---------- Magnetic glowing cursor ---------- */
    const cursor = document.getElementById("magicCursor");
    let mouseX = 0, mouseY = 0, curX = 0, curY = 0;
    window.addEventListener("mousemove", (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });
    function animateCursor() {
      curX += (mouseX - curX) * 0.18;
      curY += (mouseY - curY) * 0.18;
      cursor.style.left = curX + "px";
      cursor.style.top = curY + "px";
      requestAnimationFrame(animateCursor);
    }
    animateCursor();

    document.addEventListener("mouseover", (e) => {
      if (e.target.closest("a, button, .topic-btn, .card")) {
        cursor.classList.add("hovering");
      }
    });
    document.addEventListener("mouseout", (e) => {
      if (e.target.closest("a, button, .topic-btn, .card")) {
        cursor.classList.remove("hovering");
      }
    });

    /* ---------- 3D parallax tilt on hero photo based on mouse position ---------- */
    if (hero) {
      document.addEventListener("mousemove", (e) => {
        const xPct = (e.clientX / window.innerWidth - 0.5) * 2;

<script>
  (function () {
    /* ---------- Liquid gradient field: layered sine-wave "fluid" simulation ---------- */
    const canvas = document.getElementById("liquidField");
    const ctx = canvas.getContext("2d");
    let W, H, t = 0;
    function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
    window.addEventListener("resize", resize);
    resize();

    const blobs = [
      { cx: 0.25, cy: 0.3, r: 0.35, hue: "217,185,104", speed: 0.4 },
      { cx: 0.75, cy: 0.25, r: 0.3, hue: "124,158,255", speed: 0.3 },
      { cx: 0.5, cy: 0.75, r: 0.4, hue: "255,124,158", speed: 0.25 },
    ];

    function drawLiquid() {
      ctx.clearRect(0, 0, W, H);
      blobs.forEach((b, i) => {
        const x = W * (b.cx + Math.sin(t * b.speed + i * 2) * 0.08);
        const y = H * (b.cy + Math.cos(t * b.speed * 0.8 + i) * 0.08);
        const r = Math.min(W, H) * (b.r + Math.sin(t * 0.5 + i) * 0.04);
        const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
        grad.addColorStop(0, `rgba(${b.hue},0.35)`);
        grad.addColorStop(1, `rgba(${b.hue},0)`);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      });
      t += 0.006;
      requestAnimationFrame(drawLiquid);
    }
    drawLiquid();

    /* ---------- Kinetic decode/scramble text effect ---------- */
    const SCRAMBLE_CHARS = "アイウエオカキクケコサシスセソ0123456789#%&+*";
    function decodeText(el) {
      if (!el || el.dataset.decoded) return;
      el.dataset.decoded = "true";
      const finalText = el.textContent;
      const chars = finalText.split("");
      el.innerHTML = chars
        .map((c) => (c === " " ? " " : `<span class="decode-char">${c}</span>`))
        .join("");
      const spans = el.querySelectorAll(".decode-char");
      spans.forEach((span, i) => {
        const original = span.textContent;
        let frame = 0;
        const totalFrames = 10 + Math.random() * 6;
        const delay = i * 28;
        setTimeout(() => {
          const iv = setInterval(() => {
            frame++;
            if (frame >= totalFrames) {
              span.textContent = original;
              clearInterval(iv);
            } else {
              span.textContent = SCRAMBLE_CHARS[Math.floor(Math.random() * SCRAMBLE_CHARS.length)];
            }
          }, 35);
        }, delay);
      });
    }
    // Apply to the greeting once the page is ready
    window.addEventListener("load", () => {
      setTimeout(() => {
        const greetEl = document.getElementById("greeting");
        if (greetEl) decodeText(greetEl);
      }, 900);

      const bottomRow = document.querySelector(".bottom-row");

      if (bottomRow) bottomRow.style.transform = `translate(${xPct * -4}px, ${yPct * -3}px)`;

  <script>

    const API_BASE = "https://sagnova.onrender.com";
    let CATEGORIES = [];

    function pad(n) { return n.toString().padStart(2, "0"); }

    function tickClock() {
      const now = new Date();
      const hour = now.getHours();
      let greetWord = "Good Evening";
      if (hour < 12) greetWord = "Good Morning";
      else if (hour < 17) greetWord = "Good Afternoon";
      const name = document.getElementById("nameInput").value || "there";
      document.getElementById("greeting").textContent = `${greetWord}, ${name}`;
      document.getElementById("dateline").textContent = now.toLocaleDateString(undefined, {
        weekday: "long", year: "numeric", month: "long", day: "numeric"
      });
      document.getElementById("clockHours").textContent = pad(now.getHours() % 12 || 12);
      document.getElementById("clockMins").textContent = pad(now.getMinutes());
      document.getElementById("clockDay").textContent = now.toLocaleDateString(undefined, { weekday: "short" });
    }
    setInterval(tickClock, 1000);
    tickClock();

    async function loadCategories() {
      try {
        const res = await fetch(`${API_BASE}/categories`);
        CATEGORIES = await res.json();
        CATEGORIES.sort((a, b) => a.name.localeCompare(b.name)); // alphabetical order
        const grid = document.getElementById("topicGrid");
        grid.innerHTML = "";
        CATEGORIES.forEach(c => {
          const btn = document.createElement("button");
          btn.className = "topic-btn";
          btn.innerHTML = `<span>${c.emoji}</span><span>${c.name}</span>`;
          btn.onclick = () => burstIntoCategory(c.name, c.emoji, c.name);
          grid.appendChild(btn);
        });
      } catch (err) {
        document.getElementById("topicGrid").innerHTML =
          `<div class="status" style="grid-column:1/-1;">⚠️ Can't reach backend on 8001</div>`;
      }
    }

    document.getElementById("allTrendingBtn").onclick = () => burstIntoCategory(null, " ", "Everything Trending");
    document.getElementById("backBtn").onclick = () => {
      document.getElementById("categoryView").classList.remove("active");
      document.getElementById("heroView").classList.remove("hidden");
      window.scrollTo(0, 0);
    };

    // Game-style transition: the topic name fills the screen, then bursts apart,
    // revealing the news screen underneath. Holds for 2 seconds before transitioning.
    function burstIntoCategory(name, emoji, displayName) {
      const overlay = document.createElement("div");
      overlay.className = "burst-overlay";
      overlay.innerHTML = `
    <div class="burst-text serif">
      <div class="burst-line-1">${emoji} You chose "${displayName}"</div>
      <div class="burst-line-2">Here are some latest news</div>
    </div>`;
      document.body.appendChild(overlay);

      // trigger the fill-the-screen animation
      requestAnimationFrame(() => overlay.classList.add("burst-grow"));

      // hold for 2 seconds, then burst apart + reveal the news screen
      setTimeout(() => {
        overlay.classList.add("burst-explode");
        openCategory(name, emoji, displayName);
      }, 2000);

      // clean up the overlay after it finishes exploding
      setTimeout(() => overlay.remove(), 2600);
    }

    async function openCategory(name, emoji, displayName) {
      document.getElementById("heroView").classList.add("hidden");
      document.getElementById("categoryView").classList.add("active");
      document.getElementById("catEmoji").textContent = emoji;
      document.getElementById("catName").textContent = displayName || name;
      window.scrollTo(0, 0);
      // background is the same hero photo, just blurred + dimmed — set via CSS, no JS needed here

      const content = document.getElementById("content");
      content.innerHTML = '<div class="status">Fetching and summarizing news…</div>';

      const name_ = document.getElementById("nameInput").value || "there";
      const categories = name ? name : CATEGORIES.map(c => c.name).join(",");

      try {
        const res = await fetch(`${API_BASE}/briefing?name=${encodeURIComponent(name_)}&categories=${encodeURIComponent(categories)}`);
        if (!res.ok) throw new Error(`Server error: ${res.status}`);
        const data = await res.json();
        renderStories(data.stories);
      } catch (err) {
        content.innerHTML = `<div class="status">⚠️ ${err.message}. Is the backend running on port 8001?</div>`;
      }
    }

    function renderStories(stories) {
      const content = document.getElementById("content");
      if (!stories.length) {
        content.innerHTML = '<div class="status">No stories found for this world right now — try another.</div>';
        return;
      }
      const grid = document.createElement("div");
      grid.className = "grid";
      stories.forEach((s, idx) => {
        const card = document.createElement("div");
        card.className = "card";
        const googleQuery = encodeURIComponent(s.headline);
        card.innerHTML = `
      <div class="src">${s.source_name || ""}</div>
      <div class="headline">${s.headline}</div>
      <div class="summary">${s.summary}</div>
      <div class="why">Why it matters: ${s.why_it_matters}</div>
      <div class="scores">
        <span class="score">⭐ ${s.importance}/10</span>
        <span class="score">🇮🇳 ${s.india_impact}/10</span>
        <span class="score">💼 ${s.career_relevance}/10</span>
        <span class="score">💰 ${s.financial_impact}/10</span>
        <span class="score">🤖 ${s.ai_relevance}/10</span>
      </div>
      <div class="actions">
        ${s.source_url ? `<a class="read-link" href="${s.source_url}" target="_blank" rel="noopener">Read Article →</a>` : ""}
        <a class="google-link" href="https://news.google.com/search?q=${googleQuery}" target="_blank" rel="noopener">More on Google News</a>
      </div>
    `;
        grid.appendChild(card);
      });
      content.innerHTML = "";
      content.appendChild(grid);
    }

    document.getElementById("nameInput").addEventListener("input", tickClock);
    loadCategories();

    // Sparkle cursor follow
    const cursorEl = document.getElementById("sparkleCursor");
    document.addEventListener("mousemove", (e) => {
      cursorEl.style.left = e.clientX + "px";
      cursorEl.style.top = e.clientY + "px";
    });
    document.addEventListener("mousedown", () => cursorEl.classList.add("clicking"));
    document.addEventListener("mouseup", () => cursorEl.classList.remove("clicking"));
  </script>
</body>

</html>
