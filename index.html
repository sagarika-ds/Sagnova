<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Sags News — Your World, Curated</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --text: #f4f2ee;
      --muted: rgba(244, 242, 238, 0.65);
      --glass: rgba(20, 18, 25, 0.45);
      --glass-border: rgba(255, 255, 255, 0.14);
      --accent: #d9b968;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      color: var(--text);
      overflow-x: hidden;
    }

    .serif {
      font-family: 'Playfair Display', serif;
    }

    /* ---------------- HERO / LANDING VIEW ---------------- */
    #heroView {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background:
        linear-gradient(180deg, rgba(5, 8, 20, 0.25) 0%, rgba(5, 8, 20, 0.55) 60%, rgba(5, 8, 20, 0.8) 100%),
        url('Sg.jpg') center/cover no-repeat,
        linear-gradient(160deg, #060912 0%, #0b1330 35%, #1a2550 65%, #060912 100%);
      background-blend-mode: normal;
      padding: 40px 5vw;
    }

    #heroView>* {
      position: relative;
      z-index: 1;
    }

    .top-row {
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      gap: 24px;
      flex-wrap: wrap;
      position: relative;
      min-height: 30vh;
    }

    /* Left: greeting / clock */
    .greet-block {
      max-width: 560px;
      position: absolute;
      top: calc(8vh - 1cm);
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
    }

    .greet-title {
      font-size: clamp(30px, 5vw, 52px);
      font-weight: 700;
      line-height: 1.08;
      margin-bottom: 14px;
      background: linear-gradient(180deg, #e2bdbd 0%, #dbac3f 60%, #e3c371 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
      letter-spacing: -0.01em;
    }

    .clock-row {
      justify-content: center;
    }

    .greet-eyebrow {
      font-size: 13px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .greet-title {
      font-size: clamp(30px, 5vw, 52px);
      font-weight: 700;
      line-height: 1.08;
      margin-bottom: 14px;
    }

    .greet-sub {
      color: var(--muted);
      font-size: 15px;
      margin-bottom: 22px;
    }

    .clock-row {
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
    }

    .clock-item {}

    .clock-num {
      font-size: 26px;
      font-weight: 700;
      font-family: 'Playfair Display', serif;
    }

    .clock-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    /* Right: glass topic panel */
    .topic-panel {
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      border: none;
      border-radius: 0;
      padding: 0;
      width: min(280px, 100%);
      margin-right: 0;
      box-shadow: none;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .topic-panel h3 {
      font-family: 'Playfair Display', serif;
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(255, 255, 255, 0.75);
      letter-spacing: 0.04em;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
    }

    .topic-grid {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
      max-height: none;
      overflow: visible;
      padding: 0;
    }

    @keyframes floaty {

      0%,
      100% {
        transform: translateX(0);
      }

      50% {
        transform: translateX(-5px);
      }
    }

    .topic-btn {
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      border: none;
      color: rgba(255, 255, 255, 0.9);
      padding: 3px 2px;
      border-radius: 0;
      font-size: 16px;
      font-weight: 600;
      font-family: 'Playfair Display', serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: flex-end;
      text-align: right;
      transition: all 0.2s ease;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.75), 0 0 26px rgba(0, 0, 0, 0.45);
      animation: floaty 5s ease-in-out infinite;
    }

    .topic-btn:nth-child(2n) {
      animation-delay: -1.6s;
    }

    .topic-btn:nth-child(3n) {
      animation-delay: -3.1s;
    }

    .topic-btn span:first-child {
      font-size: 15px;
    }

    .topic-btn:hover {
      color: var(--accent);
      transform: translateX(-8px) scale(1.06);
      text-shadow: 0 2px 18px rgba(217, 185, 104, 0.8);
      animation-play-state: paused;
    }

    .all-btn {
      margin-top: 16px;
      background: rgba(217, 185, 104, 0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: var(--accent);
      font-weight: 700;
      border: 1px solid rgba(217, 185, 104, 0.5);
      padding: 12px 22px;
      border-radius: 999px;
      font-size: 13px;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .all-btn:hover {
      transform: translateY(-2px);
      background: rgba(217, 185, 104, 0.22);
    }

    /* Bottom hero tagline */
    .bottom-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .brand span {
      color: var(--accent);
    }

    .scroll-hint {
      display: none;
    }

    @keyframes sparklePulse {

      0%,
      100% {
        box-shadow: 0 0 20px 4px rgba(217, 185, 104, 0.35), inset 0 0 12px rgba(255, 255, 255, 0.15);
      }

      50% {
        box-shadow: 0 0 34px 10px rgba(217, 185, 104, 0.55), inset 0 0 18px rgba(255, 255, 255, 0.3);
      }
    }

    @keyframes sparkleSpin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .sparkle-bubble {
      display: flex;
      align-items: center;
      gap: 10px;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.25), rgba(217, 185, 104, 0.12) 60%, rgba(20, 18, 25, 0.4));
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 999px;
      padding: 10px 20px 10px 14px;
      cursor: default;
      animation: sparklePulse 2.6s ease-in-out infinite;
    }

    .sparkle-bubble .sparkle-icon {
      display: inline-block;
      animation: sparkleSpin 6s linear infinite;
      font-size: 18px;
    }

    .sparkle-bubble .sparkle-text {
      font-size: 12.5px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.9);
      font-weight: 500;
    }

    /* ---------------- CATEGORY VIEW ---------------- */
    #categoryView {
      display: none;
      min-height: 100vh;
      padding: 32px 5vw 100px;
      position: relative;
    }

    #categoryView.active {
      display: block;
    }

    #heroView.hidden {
      display: none;
    }

    .cat-bg-layer {
      position: fixed;
      inset: -20px;
      z-index: -1;
      background:
        linear-gradient(180deg, rgba(5, 8, 20, 0.55) 0%, rgba(5, 8, 20, 0.75) 100%),
        url('https://lh3.googleusercontent.com/d/1GG8QABY0V7b2jzg6UjJI6cXsVY1ipoFy') center/cover no-repeat;
      filter: blur(22px) brightness(0.6) saturate(1.1);
      transform: scale(1.08);
      /* avoids blurred edges peeking in */
    }

    /* ---------------- GAME-STYLE TOPIC BURST TRANSITION ---------------- */
    .burst-overlay {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(6, 9, 18, 0);
      pointer-events: none;
      transition: background 0.35s ease;
    }

    .burst-overlay.burst-grow {
      background: rgba(6, 9, 18, 0.7);
    }

    .burst-text {
      font-size: clamp(22px, 4.2vw, 46px);
      font-weight: 700;
      color: #fff;
      text-shadow: 0 0 40px rgba(217, 185, 104, 0.6);
      transform: scale(0.3);
      opacity: 0;
      transition: transform 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.2), opacity 0.4s ease;
      text-align: center;
      line-height: 1.4;
      padding: 0 5vw;
    }

    .burst-line-2 {
      font-size: 0.55em;
      font-weight: 500;
      color: var(--accent);
      margin-top: 6px;
    }

    .burst-overlay.burst-grow .burst-text {
      transform: scale(1);
      opacity: 1;
    }

    .burst-overlay.burst-explode .burst-text {
      transform: scale(2.6);
      opacity: 0;
      transition: transform 0.55s cubic-bezier(0.4, 0, 1, 1), opacity 0.5s ease;
    }

    .burst-overlay.burst-explode {
      background: rgba(6, 9, 18, 0);
      transition: background 0.5s ease 0.1s;
    }

    .cat-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .cat-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(26px, 4vw, 40px);
      font-weight: 700;
    }

    .cat-title .emoji {
      margin-right: 10px;
    }

    .status {
      color: var(--muted);
      text-align: center;
      padding: 60px 0;
      font-size: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 18px;
    }

    .card {
      background: rgba(15, 14, 20, 0.4);
      backdrop-filter: blur(20px) saturate(150%);
      -webkit-backdrop-filter: blur(20px) saturate(150%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 20px;
      padding: 22px;
      transform-style: preserve-3d;
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s ease, border-color 0.25s ease;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 20px 40px -20px rgba(0, 0, 0, 0.5);
    }

    .card:hover {
      transform: translateY(-6px) rotateX(2deg) rotateY(-2deg);
      box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.6);
      border-color: var(--accent);
    }

    .src {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .headline {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .summary {
      color: rgba(244, 242, 238, 0.85);
      font-size: 14px;
      line-height: 1.55;
      margin-bottom: 10px;
    }

    .why {
      color: var(--muted);
      font-size: 12.5px;
      font-style: italic;
      margin-bottom: 14px;
    }

    .scores {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .score {
      font-size: 10.5px;
      background: rgba(255, 255, 255, 0.08);
      padding: 4px 8px;
      border-radius: 6px;
      color: var(--muted);
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .read-link {
      font-size: 12.5px;
      color: #12100a;
      background: var(--accent);
      padding: 7px 12px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
    }

    .google-link {
      font-size: 12.5px;
      color: var(--muted);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 7px 12px;
      border-radius: 8px;
      text-decoration: none;
    }

    .name-input-row {
      position: fixed;
      bottom: 16px;
      left: 16px;
      z-index: 5;
    }

    .name-input-row input {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      backdrop-filter: blur(8px);
    }

    /* Custom sparkle cursor */
    body {
      cursor: none;
    }

    #sparkleCursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 26px;
      height: 26px;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      filter: drop-shadow(0 0 6px rgba(217, 185, 104, 0.9)) drop-shadow(0 0 14px rgba(217, 185, 104, 0.5));
      animation: sparkleSpin 5s linear infinite;
      transition: transform 0.06s linear;
    }

    #sparkleCursor.clicking {
      transform: translate(-50%, -50%) scale(0.7);
    }

    a,
    button,
    .topic-btn {
      cursor: none;
    }
  </style>
</head>

<body>

  <!-- ============ HERO / LANDING ============ -->
  <div id="heroView">
    <div class="top-row">
      <div class="greet-block">
        <div class="greet-eyebrow">Your world, this morning</div>
        <div class="greet-title serif" id="greeting">Good Evening, Sagarika</div>
        <div class="greet-sub" id="dateline"></div>
        <div class="clock-row">
          <div class="clock-item">
            <div class="clock-num" id="clockHours">00</div>
            <div class="clock-label">Hours</div>
          </div>
          <div class="clock-item">
            <div class="clock-num" id="clockMins">00</div>
            <div class="clock-label">Minutes</div>
          </div>
          <div class="clock-item">
            <div class="clock-num" id="clockDay">—</div>
            <div class="clock-label">Day</div>
          </div>
        </div>
      </div>

      <div class="topic-panel">
        <h3> Choose a world to explore</h3>
        <div class="topic-grid" id="topicGrid">
          <div class="status" style="grid-column:1/-1;padding:20px 0;">Loading topics…</div>
        </div>
        <button class="all-btn" id="allTrendingBtn"> Trending</button>
      </div>
    </div>

    <div class="bottom-row">
      <div class="brand">Sags News<span>.</span></div>
      <div class="scroll-hint">Click any topic above to begin ↑</div>
      <div class="sparkle-bubble">
        <span class="sparkle-icon">✨</span>
        <span class="sparkle-text">Tap a world to begin</span>
      </div>
    </div>
  </div>

  <!-- ============ CATEGORY / TOPIC PAGE ============ -->
  <div id="categoryView">
    <div class="cat-bg-layer" id="catBgLayer"></div>
    <div class="cat-header">
      <button class="back-btn" id="backBtn">← Back to Sags News</button>
      <div class="cat-title"><span class="emoji" id="catEmoji">📰</span><span id="catName">Topic</span></div>
    </div>
    <div id="content">
      <div class="status">Loading…</div>
    </div>
  </div>

  <div class="name-input-row">
    <input id="nameInput" placeholder="Your name" value="Sagarika" />
  </div>

  <div id="sparkleCursor">✨</div>

  <script>

    const API_BASE = "https://sagnova.onrender.com";
    let CATEGORIES = [];

    function pad(n) { return n.toString().padStart(2, "0"); }

    function tickClock() {
      const now = new Date();
      const hour = now.getHours();
      let greetWord = "Good Evening";
      if (hour < 12) greetWord = "Good Morning";
      else if (hour < 17) greetWord = "Good Afternoon";
      const name = document.getElementById("nameInput").value || "there";
      document.getElementById("greeting").textContent = `${greetWord}, ${name}`;
      document.getElementById("dateline").textContent = now.toLocaleDateString(undefined, {
        weekday: "long", year: "numeric", month: "long", day: "numeric"
      });
      document.getElementById("clockHours").textContent = pad(now.getHours() % 12 || 12);
      document.getElementById("clockMins").textContent = pad(now.getMinutes());
      document.getElementById("clockDay").textContent = now.toLocaleDateString(undefined, { weekday: "short" });
    }
    setInterval(tickClock, 1000);
    tickClock();

    async function loadCategories() {
      try {
        const res = await fetch(`${API_BASE}/categories`);
        CATEGORIES = await res.json();
        CATEGORIES.sort((a, b) => a.name.localeCompare(b.name)); // alphabetical order
        const grid = document.getElementById("topicGrid");
        grid.innerHTML = "";
        CATEGORIES.forEach(c => {
          const btn = document.createElement("button");
          btn.className = "topic-btn";
          btn.innerHTML = `<span>${c.emoji}</span><span>${c.name}</span>`;
          btn.onclick = () => burstIntoCategory(c.name, c.emoji, c.name);
          grid.appendChild(btn);
        });
      } catch (err) {
        document.getElementById("topicGrid").innerHTML =
          `<div class="status" style="grid-column:1/-1;">⚠️ Can't reach backend on 8001</div>`;
      }
    }

    document.getElementById("allTrendingBtn").onclick = () => burstIntoCategory(null, " ", "Everything Trending");
    document.getElementById("backBtn").onclick = () => {
      document.getElementById("categoryView").classList.remove("active");
      document.getElementById("heroView").classList.remove("hidden");
      window.scrollTo(0, 0);
    };

    // Game-style transition: the topic name fills the screen, then bursts apart,
    // revealing the news screen underneath. Holds for 2 seconds before transitioning.
    function burstIntoCategory(name, emoji, displayName) {
      const overlay = document.createElement("div");
      overlay.className = "burst-overlay";
      overlay.innerHTML = `
    <div class="burst-text serif">
      <div class="burst-line-1">${emoji} You chose "${displayName}"</div>
      <div class="burst-line-2">Here are some latest news</div>
    </div>`;
      document.body.appendChild(overlay);

      // trigger the fill-the-screen animation
      requestAnimationFrame(() => overlay.classList.add("burst-grow"));

      // hold for 2 seconds, then burst apart + reveal the news screen
      setTimeout(() => {
        overlay.classList.add("burst-explode");
        openCategory(name, emoji, displayName);
      }, 2000);

      // clean up the overlay after it finishes exploding
      setTimeout(() => overlay.remove(), 2600);
    }

    async function openCategory(name, emoji, displayName) {
      document.getElementById("heroView").classList.add("hidden");
      document.getElementById("categoryView").classList.add("active");
      document.getElementById("catEmoji").textContent = emoji;
      document.getElementById("catName").textContent = displayName || name;
      window.scrollTo(0, 0);
      // background is the same hero photo, just blurred + dimmed — set via CSS, no JS needed here

      const content = document.getElementById("content");
      content.innerHTML = '<div class="status">Fetching and summarizing news…</div>';

      const name_ = document.getElementById("nameInput").value || "there";
      const categories = name ? name : CATEGORIES.map(c => c.name).join(",");

      try {
        const res = await fetch(`${API_BASE}/briefing?name=${encodeURIComponent(name_)}&categories=${encodeURIComponent(categories)}`);
        if (!res.ok) throw new Error(`Server error: ${res.status}`);
        const data = await res.json();
        renderStories(data.stories);
      } catch (err) {
        content.innerHTML = `<div class="status">⚠️ ${err.message}. Is the backend running on port 8001?</div>`;
      }
    }

    function renderStories(stories) {
      const content = document.getElementById("content");
      if (!stories.length) {
        content.innerHTML = '<div class="status">No stories found for this world right now — try another.</div>';
        return;
      }
      const grid = document.createElement("div");
      grid.className = "grid";
      stories.forEach((s, idx) => {
        const card = document.createElement("div");
        card.className = "card";
        const googleQuery = encodeURIComponent(s.headline);
        card.innerHTML = `
      <div class="src">${s.source_name || ""}</div>
      <div class="headline">${s.headline}</div>
      <div class="summary">${s.summary}</div>
      <div class="why">Why it matters: ${s.why_it_matters}</div>
      <div class="scores">
        <span class="score">⭐ ${s.importance}/10</span>
        <span class="score">🇮🇳 ${s.india_impact}/10</span>
        <span class="score">💼 ${s.career_relevance}/10</span>
        <span class="score">💰 ${s.financial_impact}/10</span>
        <span class="score">🤖 ${s.ai_relevance}/10</span>
      </div>
      <div class="actions">
        ${s.source_url ? `<a class="read-link" href="${s.source_url}" target="_blank" rel="noopener">Read Article →</a>` : ""}
        <a class="google-link" href="https://news.google.com/search?q=${googleQuery}" target="_blank" rel="noopener">More on Google News</a>
      </div>
    `;
        grid.appendChild(card);
      });
      content.innerHTML = "";
      content.appendChild(grid);
    }

    document.getElementById("nameInput").addEventListener("input", tickClock);
    loadCategories();

    // Sparkle cursor follow
    const cursorEl = document.getElementById("sparkleCursor");
    document.addEventListener("mousemove", (e) => {
      cursorEl.style.left = e.clientX + "px";
      cursorEl.style.top = e.clientY + "px";
    });
    document.addEventListener("mousedown", () => cursorEl.classList.add("clicking"));
    document.addEventListener("mouseup", () => cursorEl.classList.remove("clicking"));
  </script>
</body>

</html>
